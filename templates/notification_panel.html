<div id="notiPanel"
     role="dialog"
     aria-label="การแจ้งเตือน"
     data-list-url="{{ url_for('noti.notifications_list') }}"
     data-mark-all-url="{{ url_for('noti.mark_all_read') }}"
     data-mark-read-url-template="{{ url_for('noti.mark_read', nid=0) }}"
     data-unread-url="{{ url_for('noti.unread_count') }}"
     data-max-items="100"
     class="absolute right-0 top-full mt-2 w-[90vw] sm:w-[380px] hidden z-[60]
            rounded-2xl border border-white/10 bg-[var(--panel)] shadow-2xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
    <span class="font-semibold text-zinc-100">การแจ้งเตือน</span>
    <span id="notiPanelCount" class="text-xs text-zinc-400"></span>
  </div>
  <div class="flex items-center justify-between gap-3 px-4 py-2 border-b border-white/10 text-xs text-zinc-300">
    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
      <input id="notiUnreadToggle" type="checkbox" class="accent-white">
      แสดงเฉพาะยังไม่อ่าน
    </label>
    <button id="notiMarkAllBtn" type="button"
            class="px-3 py-1 rounded-full border border-white/15 bg-white/5 text-xs text-zinc-200 hover:text-white hover:border-white/30">
      ทำเครื่องหมายว่าอ่านแล้ว
    </button>
  </div>

  <div id="notiScroll" class="max-h-[420px] overflow-y-auto">
    <ul id="notiList" class="divide-y divide-white/10"></ul>
    <div id="notiEmpty" class="hidden px-4 py-6 text-center text-sm text-zinc-400">
      ไม่มีการแจ้งเตือน
    </div>
  </div>

  <div id="notiLoading" class="hidden px-4 py-2 text-xs text-zinc-400">กำลังโหลด...</div>
  <div id="notiEnd" class="hidden px-4 py-2 text-xs text-zinc-500">แสดงครบ 100 รายการล่าสุด</div>
</div>
