<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}MY SHELF{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-[#0b0b0b] text-zinc-100">
  {% include "header.html" %}

  {% include "_flash_toasts.html" %}

  <!-- ✅ main ต้องมี bg ด้วย ไม่งั้นพื้นที่ว่างใต้ header จะเป็นสีขาว -->
  <main class="bg-[#0b0b0b] min-h-screen">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
